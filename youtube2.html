<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .subscribe-button{
            background-color: rgb(200, 0, 0);
            color: white;
            height:35px;
            width:105px;
            border:none;
            border-radius:2px;
            margin-right:8px;
            cursor:pointer;
        }
        .subscribe-button:hover{
            /* background-color: green; */
            opacity:0.8;
        }
        .subscribe-button:active{
            /* background-color: blue; */
            opacity:0.5;
        }
        .join-button{
            background-color: white;
            width:60px;
            height:35px;
            border-style:solid;
            border-width:1px;
            border-radius:2px;
            border-color:rgb(7,136,211);
            color:rgb(7,136,211);
            cursor:pointer;

            transition: background-color 1s,color 0.15s;
        }
        .join-button:hover{
            background-color: rgb(7,136,211);
            color:white;
        }
        .tweet-button{
            background-color:rgb(9,141,193);
            color:white;
            height:35px;
            width:80px;
            font-size:16px;
            font-weight:700;
            border:none;
            border-radius:20px;
            margin-left:8px;
            cursor:pointer;
             transition: box-shadow 0.15s; 
        }
        .tweet-button:hover{
            box-shadow: 5px 5px 10px rgba(0,0,0,0.15);
        }
    </style>
</head>
<body>
    <button class="subscribe-button">SUBSCRIBE</button>
    <button class="join-button">JOIN</button>
    <button class="tweet-button">Tweet</button>
</body>
</html>
