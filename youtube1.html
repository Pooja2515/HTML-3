<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .subscribe-button{
            background-color: rgb(200, 0, 0);
            color: white;
            height:35px;
            width:105px;
            border:none;
            border-radius:2px;
            margin-right:8px;
            cursor:pointer;
        }
        .join-button{
            background-color: white;
            width:60px;
            height:35px;
            border-style:solid;
            border-width:1px;
            border-radius:2px;
            border-color:rgb(7,136,211);
            color:rgb(7,136,211);
            cursor:pointer;
        }
        .tweet-button{
            background-color:rgb(9,141,193);
            color:white;
            height:35px;
            width:80px;
            font-size:16px;
            font-weight:700;
            border:none;
            border-radius:20px;
            margin-left:8px;
            cursor:pointer;
            
        }
    </style>
</head>
<body>
    <button class="subscribe-button">SUBSCRIBE</button>
    <button class="join-button">JOIN</button>
    <button class="tweet-button">Tweet</button>
</body>
</html>
