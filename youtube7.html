<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <title>Youtube Clone</title>
    <style>
        .p1{
            width:300px;
            display:block;
        }
        .search-bar{
            font-size:20px;
            display: block;
            margin-left: 30px;
        }
       .div1{
        width:300px;
        display: inline-block;
        vertical-align: top;
        margin-right: 15px;
       }
       .box{
        width:300px;
        display: inline-block;
        margin-right: 15px;
       }
       .thumb{
        margin-bottom: 15px;
       }
       p{
        margin-top: 0;
       }
       .profile{
        display: inline-block;
        width:50px;
        vertical-align: top;
        margin-right:15px ;
       }
       .pro{
        width:100%;
        border-radius: 40px;

       }
       .text{
        font-family: "Roboto",Arial;
        display: inline-block;
        width: 230px;
       }
       .p2{
        font-weight: bold;
        font-size:18px;
        margin-bottom: 10px;
       }
       .p3,.p4{
        font-size:14px;
        margin-top:0;
        margin-bottom: 6px;
       }
    </style>
</head>
<body>
    <input class="search-bar" type="text" placeholder="Search">
    <div class="box">
        <div class="thumb">
            <img class="p1" src="https://collegecoders.github.io/college-coders-youtube/thumbnails/thumbnail-1.webp" alt="">
        </div>
        <div class="pro-text">
            <div class="profile">
                <img class="pro" src="https://collegecoders.github.io/college-coders-youtube/profiles/channel-1.jpeg" alt="">
            </div>
            <div class="text">
                <p class="p2">Talking Tech and AI with Google CEO Sundar Pichai!</p>
                <p class="p3">Marques Brownlee</p>
                <p class="p4">3.4M views &#183; 6 months ago</p>
            </div>
        </div>
    </div>
    <div class="box">
        <div class="thumb">
            <img class="p1" src="https://collegecoders.github.io/college-coders-youtube/thumbnails/thumbnail-3.webp" alt="">
        </div>
        <div class="pro-text">
            <div class="profile">
                <img class="pro" src="https://collegecoders.github.io/college-coders-youtube/profiles/channel-3.jpeg" alt="">
            </div>
            <div class="text">
                <p class="p2">Crazy Tik Toks Taken Moments Before DISASTER</p>
                <p class="p3">SSSniperWolf</p>
                <p class="p4">12M views &#183; 1 year ago</p>
            </div>
        </div>
    </div>
</body>
</html>
