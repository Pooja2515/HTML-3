<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .request-button{
            background-color:black;
            color:white;
            height:40px;
            width:110px;
            border:none;
            cursor: pointer;
        }
        .cart-button{
            background-color: rgb(255,216,20);
            color:black;
            height: 30px;
            width:110px;
            border:none;
            border-radius: 15px;
            cursor: pointer;
        }
        .sign-button{
            background-color:rgb(46,164,79);
            color:white;
            height:40px;
            width:130px;
            border:none;
            font-weight: bold;
            font-size: 15px;
            border-radius:6px;
            cursor:pointer;
        }
        .started-button{
            background-color: rgb(121,82,179);
            color:white;
            height:40px;
            width:110px;
            border:none;
            border-radius:4px;
            font-weight: bold;
            cursor:pointer;
        }
        .download-button{
            background-color: white;
            height:40px;
            width:100px;
            border-width:1px;
            border-style:solid;
            border-radius: 4px;
            font-weight:bold;
            border-color: rgb(108,117,125);
            color: rgb(108,117,125);
            cursor:pointer;
        }
        .apply-button{
            background-color: rgb(10,102,194);
            color:white;
            height:40px;
            width:240px;
            border:none;
            font-weight:bold;
            font-size:15px;
            border-radius:20px;
            cursor:pointer;
            margin-right: 8px;
        }
        .save-button{
            background-color: white;
            color:rgb(10,102,194);
            border-color: rgb(10,102,194);
            height:40px;
            width:80px;
            font-weight:bold;
            font-size:15px;
            border:none;
            border-width:1px;
            border-style:solid;
            border-radius:20px;
            cursor: pointer;
        }
        .title{
            font-size:24px;
            font-weight:bold;
        }
        .price{
            color:rgb(0,136,0);
            font-weight:bold;
        }
        .buy-button{
            background-color: rgb(255,164,28);
            border:none;
            height:30px;
            width:110px;
            border-radius: 15px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <button class="request-button">Request now</button><br> <br>
    <button class="cart-button">Add to Cart</button><br> <br>
    <button class="sign-button">Sign Up</button><br> <br>
    <button class="started-button">Get Started</button>
    <button class="download-button">Download</button><br> <br>
    <button class="apply-button">Apply on company website</button>
    <button class="save-button">Save</button><br> <br>
    <a href="https://www.amazon.in/" target="_blank">Back to Amazon</a>
    <p class="title">Nike Black Running Shoes</p>
    <p class="price">$39- in stock.</p>
    <p>Free delivery tomorrow</p>
    <button class="cart-button">Add to Cart</button>
    <button class="buy-button"> Buy Now</button>
</body>
</html>
